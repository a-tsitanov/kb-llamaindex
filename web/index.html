<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lens</title>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <span class="brand">Lens</span>
    <select id="wsSel" title="Расследование"></select>
    <button id="newWs" class="ghost" title="Новое расследование">＋</button>
    <span class="pill" id="wsPill">нет расследования</span>
    <span class="grow"></span>
    <span class="srv" id="srv">—</span>
    <button id="tglJournal" class="ghost on" title="Журнал работы агента">Журнал</button>
    <button id="tglNotes" class="ghost on" title="Заметки на доске">Заметки</button>
    <button id="cfgBtn" class="ghost" title="Настройки">⚙</button>
  </header>

  <aside class="journal" id="journal"></aside>

  <main class="stage">
    <div id="net"></div>
  </main>

  <aside class="notes" id="notes"></aside>

  <footer class="bottom">
    <div class="box" id="box"><input id="q" placeholder="встречи Путина в Китае" autocomplete="off"></div>
    <div class="status"><span class="legend" id="legend"></span><span class="hint" title="«скрой X», «отмени», «стоп» — остановить">клик — упомянуть @ · Enter — отправить</span><span id="st">готово</span></div>
  </footer>
  <div class="toast" id="toast"></div>
</div>

  <div class="modal" id="cfg" hidden><div class="card">
    <b>Подключение</b>
    <label>X-API-Key (LENS_API_KEYS)<input id="cKey" type="password"></label>
    <div class="row"><button id="cSave">Сохранить</button></div>
  </div></div>

  <div class="modal" id="detail" hidden><div class="card wide">
    <div class="row between"><b id="dTitle"></b><button id="dClose">✕</button></div>
    <pre id="dBody"></pre>
  </div></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
