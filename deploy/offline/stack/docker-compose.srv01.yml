# srv01 (10.10.113.11) — DATA node. Override on top of docker-compose.prod.yml:
#
#   docker compose -p kb -f docker-compose.prod.yml -f deploy/offline/stack/docker-compose.srv01.yml \
#     --env-file deploy/offline/stack/.env.offline up -d \
#     postgres etcd minio milvus nebula-metad nebula-storaged nebula-graphd redis rabbitmq embed
#
# Socket 0 (cpus 0-19,40-59) = storage/queues; socket 1 (20-39,60-79) = embeddings.
# Ports are published because srv02/srv03 reach these services over the LAN.

x-sock0: &sock0 {cpuset: "0-19,40-59"}

services:
  postgres:
    <<: *sock0
    ports: ["5432:5432"]
  etcd:
    <<: *sock0
  minio:
    <<: *sock0
  milvus:
    <<: *sock0
    ports: ["19530:19530", "9091:9091"]
  nebula-metad:
    <<: *sock0
  nebula-storaged:
    <<: *sock0
  nebula-graphd:
    <<: *sock0
    ports: ["9669:9669"]
  redis:
    <<: *sock0
    ports: ["6379:6379"]
  rabbitmq:
    <<: *sock0

  # bge-m3 embeddings (1024-dim == MILVUS_DIM) via llama.cpp, OpenAI-compatible /v1/embeddings.
  embed:
    image: ghcr.io/ggml-org/llama.cpp:server
    pull_policy: never
    cpuset: "20-39,60-79"
    command: >
      --model /models/bge-m3-FP16.gguf --embedding --pooling cls
      --ctx-size 32768 --batch-size 8192 --ubatch-size 8192 --parallel 4
      --threads 20 --host 0.0.0.0 --port 8080 --alias bge-m3
    volumes: ["/opt/models:/models:ro"]
    ports: ["8081:8080"]
    restart: unless-stopped

  # doc2md (any document -> Markdown) for the web UI. OCR off (no GPU, decision
  # 2026-10-04): scans/images return 503 ocr_unavailable. Socket 1, next to embed.
  docs2md:
    image: doc2md:offline
    pull_policy: never
    cpuset: "20-39,60-79"
    environment:
      OCR_BACKEND: none
      PAGE_MARKERS: "false"
      MAX_FILE_MB: "100"
      MAX_PAGES: "500"
      LOG_LEVEL: INFO
    ports: ["8070:8080"]
    restart: unless-stopped

  # Agent web UI (DeepSeek Harness, MIT, rebranded at image build: BRAND_NAME):
  # agent + KB MCP tools, models via LiteLLM on srv02. The agent has a bash tool.
  # It binds 127.0.0.1 only; LAN access goes through lan-proxy on
  # 10.10.113.11:3080 (client allowlist LAN_ALLOW) + token/cookie login.
  # Renamed from dsh-web (2026-10-14); data volumes keep their kb_dsh_* names.
  agent-web:
    image: agent-web:offline
    pull_policy: never
    cpuset: "20-39,60-79"
    environment:
      LITELLM_API_KEY: ${LITELLM_API_KEY:?set LITELLM_API_KEY}
      KB_MCP_TOKEN: ${KB_MCP_TOKEN:?set KB_MCP_TOKEN (one of API_KEYS) in .env.offline}
      AGENT_TRUSTED_HOST: "localhost:3080 10.10.113.11:3080"
      # LAN access via the allowlisted L4 proxy (the UI itself stays on 127.0.0.1).
      LAN_BIND: 10.10.113.11:3080
      LAN_ALLOW: ${AGENT_LAN_ALLOW:-${DSH_LAN_ALLOW:-10.10.0.0/16}}
    volumes:
      - dsh_data:/data
      - dsh_workspace:/workspace
    # dsh refuses --host 0.0.0.0 (RCE safety guard), so share the host network
    # and bind 127.0.0.1 → listens on srv01 loopback only.
    network_mode: host
    restart: unless-stopped

  # LiteLLM (srv02:4000) re-published on srv01:4000. Through the corporate VPN
  # only srv01 answers (srv02/03 replies are lost past the gateway), so VPN
  # clients (e.g. the .31 gateway PC) use http://10.10.113.11:4000/v1.
  # Same allowlisted L4 proxy as agent-web, run from the agent-web image.
  llm-proxy:
    image: agent-web:offline
    pull_policy: never
    entrypoint: ["node", "/opt/dsh/lan-proxy.mjs"]
    environment:
      LAN_BIND: 10.10.113.11:4000
      LAN_TARGET_HOST: 10.10.113.12
      LAN_TARGET_PORT: "4000"
      LAN_ALLOW: ${AGENT_LAN_ALLOW:-${DSH_LAN_ALLOW:-10.10.0.0/16}}
    network_mode: host
    restart: unless-stopped

# Explicit names = the volumes created by the former dsh-web service, so
# sessions, workspace and .credentials.yaml (cookie signing secret) survive.
volumes:
  dsh_data:
    name: kb_dsh_data
  dsh_workspace:
    name: kb_dsh_workspace
