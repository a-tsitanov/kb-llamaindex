# srv02 (10.10.113.12) — APP + SEARCH node. Override on top of docker-compose.prod.yml:
#
#   docker compose -p kb -f docker-compose.prod.yml -f deploy/offline/stack/docker-compose.srv02.yml \
#     --env-file deploy/offline/stack/.env.offline up -d \
#     temporal temporal-ui litellm llm-search init api worker ingest-consumer \
#     mcp-search mcp-tools mcp-stats prometheus grafana
#
# Backends live on srv01 (data) — every service-name host is rewritten to an IP,
# and cross-host depends_on are dropped (!reset): restart policies cover start order.
# Socket 0 = app code + temporal; socket 1 = search LLM (Qwen3-30B-A3B).

x-sock0: &sock0 {cpuset: "0-19,40-59"}

x-remote-env: &remote-env
  MILVUS_HOST: 10.10.113.11
  POSTGRES_HOST: 10.10.113.11
  MINIO_ENDPOINT: 10.10.113.11:9000
  NEBULA_HOST: 10.10.113.11
  REDIS_HOST: 10.10.113.11
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@10.10.113.11:5672/
  TEMPORAL_HOST: temporal
  WORKER_GROUPS: ""
  # Neo4j is gone (nebula is the graph backend) but the prod preflight still
  # rejects the "changeme" default — feed it a real random secret.
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env.offline}
  # CPU LLMs: one extraction answer is 60-100 s of generation. The 60 s default
  # timed every call out and retried it from scratch (2026-10-04).
  LITELLM_TIMEOUT_S: "900"
  LITELLM_MAX_RETRIES: "1"
  # Entity watch (monitor sweep every 2 min, feed via MCP kb_watch_feed). The
  # feed links documents through webui, which holds the API key. The interval
  # lives in the Temporal Schedule: re-run scripts.setup_monitor_schedule after
  # changing it.
  MONITOR_ENABLED: "true"
  MONITOR_SWEEP_INTERVAL_MINUTES: "2"
  MONITOR_DOCUMENT_LINK: "http://10.10.113.12:8090/api/documents/{doc_id}"
  # Download link next to every doc_id the MCP tools return (download_url) and
  # in the watch e-mail; via webui (API key). No ?variant: the API serves the
  # original upload when there is one, else the text (old docs, Telegram posts).
  API_DOCUMENT_URL: "http://10.10.113.12:8090/api/documents/{doc_id}"
  # Nightly graph maintenance as Temporal Schedules (UTC; empty = none). Apply
  # with `python -m scripts.setup_graph_schedules` after changing.
  TEMPORAL_COMMUNITY_SCHEDULE_CRON: ${TEMPORAL_COMMUNITY_SCHEDULE_CRON:-0 2 * * *}
  TEMPORAL_ANALYTICS_SCHEDULE_CRON: ${TEMPORAL_ANALYTICS_SCHEDULE_CRON:-0 7 * * *}
  # E-mail digest of watch events, one letter per sweep (off unless
  # MONITOR_EMAIL_ENABLED=true in .env.offline). Default target = Mailpit on srv01.
  MONITOR_EMAIL_ENABLED: ${MONITOR_EMAIL_ENABLED:-false}
  MONITOR_EMAIL_SMTP_HOST: ${MONITOR_EMAIL_SMTP_HOST:-10.10.113.11}
  MONITOR_EMAIL_SMTP_PORT: ${MONITOR_EMAIL_SMTP_PORT:-25}
  MONITOR_EMAIL_FROM: ${MONITOR_EMAIL_FROM:-kb-watch@kb.local}
  MONITOR_EMAIL_TO: ${MONITOR_EMAIL_TO:-}

x-app: &app
  <<: *sock0
  image: kb-app:offline
  pull_policy: never

services:
  temporal:
    <<: *sock0
    environment:
      POSTGRES_SEEDS: 10.10.113.11
    ports: ["7233:7233"]
    depends_on: !reset {}
  temporal-ui:
    <<: *sock0

  litellm:
    <<: *sock0
    image: ghcr.io/berriai/litellm:main-stable
    pull_policy: never
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY:-sk-litellm-stub}
      # Admin UI (http://10.10.113.12:4000/ui) needs a DB; DB `litellm` lives on
      # srv01 postgres. STORE_MODEL_IN_DB: models added via /model/new live in the
      # DB and can be edited without a restart (llm-autoscale below uses it);
      # models from the config file stay read-only.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@10.10.113.11:5432/litellm
      STORE_MODEL_IN_DB: "True"
      UI_USERNAME: admin
      UI_PASSWORD: ${LITELLM_UI_PASSWORD:?set LITELLM_UI_PASSWORD in .env.offline}
      # no internet: skip the remote model-cost-map fetch (~30 s of retries at boot)
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    volumes: ["./deploy/offline/stack/litellm_config.offline.yaml:/app/config.yaml:ro"]
    ports: ["4000:4000"]
    restart: unless-stopped

  # Adaptive cap on our share of the shared GPU vLLM: its queue grows -> lower
  # max_parallel_requests of the DB deployment AUTOSCALE_MODEL_ID, queue empty ->
  # raise it (deploy/offline/stack/llm_autoscale.py). Logs: docker logs kb-llm-autoscale-1
  llm-autoscale:
    <<: *sock0
    image: ghcr.io/berriai/litellm:main-stable
    pull_policy: never
    entrypoint: ["python", "/app/llm_autoscale.py"]
    environment:
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY:-sk-litellm-stub}
      VLLM_METRICS: ${AUTOSCALE_VLLM_METRICS:-http://10.10.151.15:8000/metrics}
      AUTOSCALE_MODEL_ID: ${AUTOSCALE_MODEL_ID:-ds15-small}
      AUTOSCALE_MIN: ${AUTOSCALE_MIN:-2}
      AUTOSCALE_MAX: ${AUTOSCALE_MAX:-12}
    volumes: ["./deploy/offline/stack/llm_autoscale.py:/app/llm_autoscale.py:ro"]
    restart: unless-stopped

  # Search / answer-synthesis LLM: "large" alias. Few slots → low latency.
  llm-search:
    image: ghcr.io/ggml-org/llama.cpp:server
    pull_policy: never
    cpuset: "20-39,60-79"
    command: >
      --model /models/Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf --alias qwen3-30b-a3b
      --ctx-size 65536 --parallel 2 --threads 20 --load-mode none --jinja
      --cache-reuse 256 --host 0.0.0.0 --port 8080
    volumes: ["/opt/models:/models:ro"]
    ports: ["8085:8080"]
    restart: unless-stopped

  init:
    <<: *app
    environment: *remote-env
    depends_on: !reset {}
  api:
    <<: *app
    environment: *remote-env
    depends_on: !reset {}
  worker:
    <<: *app
    image: kb-app-rerank:offline
    environment:
      <<: *remote-env
      # everything except the LLM extraction pool (that runs on srv03)
      WORKER_GROUPS: main,merge,search,large,graph_build,wiki,scheduler,monitor
    depends_on: !reset {}
  ingest-consumer:
    <<: *app
    environment: *remote-env
    depends_on: !reset {}
  mcp-search:
    <<: *app
    environment: *remote-env
    depends_on: !reset {}
  mcp-tools:
    <<: *app
    environment: *remote-env
    depends_on: !reset {}
  mcp-stats:
    <<: *app
    environment: *remote-env
    depends_on: !reset {}
  prometheus:
    <<: *sock0
  grafana:
    <<: *sock0
    depends_on: !reset {}

  # Web UI: upload -> docs2md -> ingest, and search. Runs on the app image (no
  # extra image offline); the KB API key stays server-side. Open on the LAN.
  webui:
    <<: *sock0
    image: kb-app:offline
    pull_policy: never
    command: ["uvicorn", "app:app", "--app-dir", "/webui", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      KB_API_URL: http://api:8000
      KB_API_KEY: ${API_KEYS:?set API_KEYS in .env.offline}
      DOCS2MD_URL: http://10.10.113.11:8070
    volumes: ["./deploy/offline/webui:/webui:ro"]
    ports: ["8090:8090"]
    restart: unless-stopped
