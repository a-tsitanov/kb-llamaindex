# srv03 (10.10.113.13) — INGEST LLM node. Override on top of docker-compose.prod.yml:
#
#   docker compose -p kb -f docker-compose.prod.yml -f deploy/offline/stack/docker-compose.srv03.yml \
#     --env-file deploy/offline/stack/.env.offline up -d llm-ingest-0 llm-ingest-1 worker-llm
#
# One llama-server per socket (memory bandwidth is the ceiling, NUMA-local is
# ~2x a cross-socket instance). worker-llm only waits on HTTP, it is cheap.

x-llm-ingest: &llm-ingest
  image: ghcr.io/ggml-org/llama.cpp:server
  pull_policy: never
  volumes: ["/opt/models:/models:ro"]
  restart: unless-stopped

x-llm-ingest-cmd: &llm-ingest-cmd >
  --model /models/Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf --alias qwen3-30b-a3b
  --ctx-size 32768 --parallel 1 --threads 20 --load-mode none --jinja --reasoning off
  --cache-reuse 256 --host 0.0.0.0 --port 8080

services:
  llm-ingest-0:
    <<: *llm-ingest
    cpuset: "0-19,40-59"
    command: *llm-ingest-cmd
    ports: ["8082:8080"]
  llm-ingest-1:
    <<: *llm-ingest
    cpuset: "20-39,60-79"
    command: *llm-ingest-cmd
    ports: ["8083:8080"]

  worker-llm:
    extends: {file: docker-compose.prod.yml, service: worker}
    image: kb-app:offline
    pull_policy: never
    cpuset: "0-19,40-59"
    environment:
      MILVUS_HOST: 10.10.113.11
      POSTGRES_HOST: 10.10.113.11
      MINIO_ENDPOINT: 10.10.113.11:9000
      NEBULA_HOST: 10.10.113.11
      REDIS_HOST: 10.10.113.11
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@10.10.113.11:5672/
      TEMPORAL_HOST: 10.10.113.12
      WORKER_GROUPS: llm
      # GPU vLLM is primary (2026-10-05): ~8-12 parallel calls saturate it
      LLM_POOL_N: "8"
      LITELLM_TIMEOUT_S: "900"
      LITELLM_MAX_RETRIES: "1"
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env.offline}
      METRICS_ENABLED: "false"
    depends_on: !reset {}
    restart: unless-stopped
