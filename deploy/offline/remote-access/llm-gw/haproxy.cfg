# LLM gateway on .31: replaces the local LiteLLM. Every app container keeps
# LITELLM_BASE_URL=http://litellm:4000 (this service has the `litellm` alias)
# and is forwarded to the cluster LiteLLM on srv02; srv01:4000 (agent-web proxy
# to the same srv02 LiteLLM) is the backup when the VPN only reaches srv01.
# The client key is replaced by the srv02 virtual key `agent_v2-31` (LLM_GW_KEY).
global
    log stdout format raw local0 notice

defaults
    mode http
    log global
    option dontlognull
    timeout connect 5s
    timeout client 1000s
    timeout server 1000s
    retries 2
    option redispatch

frontend litellm
    bind :4000
    http-request set-header Authorization "Bearer ${LLM_GW_KEY}"
    default_backend cluster

backend cluster
    option httpchk GET /health/liveliness
    http-check expect status 200
    server srv02 10.10.113.12:4000 check inter 10s fall 2 rise 2
    server srv01 10.10.113.11:4000 check inter 10s fall 2 rise 2 backup
